# fly.toml app configuration file generated for book-fair on 2026-01-22T17:19:11+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "book-fair"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "book_fair_data"
  destination = "/data"
